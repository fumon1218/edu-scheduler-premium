<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#344B68" />
    <title>Edu-Scheduler Premium</title>
    <script>
      // 화면이 깜빡이지 않도록, 저장된(또는 기기 설정에 맞는) 라이트/다크 테마를 먼저 적용합니다.
      (function () {
        try {
          var t = localStorage.getItem('eduThemeV1');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed'; div.style.top = '0'; div.style.left = '0';
        div.style.width = '100%'; div.style.height = '100%';
        div.style.backgroundColor = 'white'; div.style.color = 'red';
        div.style.padding = '20px'; div.style.zIndex = '99999';
        div.style.overflow = 'auto'; div.style.fontSize = '12px';
        div.innerHTML = '<h3>[Debug] Error Detected:</h3>' +
                        '<p><b>Msg:</b> ' + msg + '</p>' +
                        '<p><b>Line:</b> ' + line + ' <b>Col:</b> ' + col + '</p>' +
                        '<pre>' + (error ? error.stack : 'No stack trace') + '</pre>' +
                        '<button onclick="location.reload()" style="padding:10px; background:red; color:white; border:none; border-radius:5px;">새로고침</button>';
        document.body.appendChild(div);
        return false;
      };
    </script>
    <script type="module" crossorigin src="/edu-scheduler-premium/assets/index-Bei8nvnQ.js"></script>
    <link rel="stylesheet" crossorigin href="/edu-scheduler-premium/assets/index-TdGuIwbn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
